name: CI

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: kalinichenko88/ai-digest

jobs:
  quality:
    name: Quality Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Biome check
        run: npx biome check --error-on-warnings

      - name: Typecheck
        run: npx tsc --noEmit

      # The image runs dist/mcp-server.js; the Docker build does not check that the file exists
      - name: Build
        run: npm run build && test -f dist/mcp-server.js

      # The runner's yq is the Go one; the apply-update.sh test also needs the Python yq, off PATH
      - name: Install the Python yq
        run: |
          python3 -m venv "$RUNNER_TEMP/python-yq"
          "$RUNNER_TEMP/python-yq/bin/pip" install --quiet yq==4.4.5
          echo "PYTHON_YQ=$RUNNER_TEMP/python-yq/bin/yq" >> "$GITHUB_ENV"

      - name: Run tests
        run: npm test

  docker:
    name: Build Docker Image (push on a tag)
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      # The image is built on every push, so a Dockerfile change fails before the release; it is pushed only on a tag
      - uses: docker/login-action@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  release:
    name: Build & Publish Release
    needs: [quality, docker]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build release archive
        run: ./scripts/build-archive.sh "${{ steps.version.outputs.version }}"

      - name: Upload archive to release
        run: gh release upload "${{ github.ref_name }}" "ai-digest-v${{ steps.version.outputs.version }}.tar.gz" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload install.sh to release
        run: gh release upload "${{ github.ref_name }}" scripts/install.sh --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish release (remove draft)
        run: gh release edit "${{ github.ref_name }}" --draft=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
